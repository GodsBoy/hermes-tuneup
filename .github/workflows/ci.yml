name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The Hermes Agent commit tuneup is tested against. Keep in step with
  # requires_hermes in plugin.yaml.
  HERMES_REF: ca4360692055bdb4df3a695c164646e528891da8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Agent at the pinned commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@${HERMES_REF}" pytest pyyaml

      - name: Unit tests
        run: python -m pytest -q

      - name: Catalogue validation
        run: hermes plugins validate . --install-deps
